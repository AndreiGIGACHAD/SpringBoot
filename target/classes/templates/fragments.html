<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <body>
        <nav th:fragment="nav">
            <a class="brand" th:href="@{/}">Магазин электроники</a>
            <div class="nav-links">
                <a th:href="@{/}">Главная</a>
                <a th:href="@{/products}">Каталог товаров</a>
                <a th:href="@{/categories}">Категории</a>
                <a th:href="@{/calculator}">Калькулятор</a>
                <a th:href="@{/about}">О приложении</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">Пользователи</a>
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/logs}">Журнал действий</a>
            </div>
            <div class="nav-user">
                <span sec:authentication="name">
                </span>
                <form th:action="@{/logout}" method="post">
                    <button class="button-ghost">Выйти</button>
                </form>
            </div>
        </nav>
    </body>
</html>
