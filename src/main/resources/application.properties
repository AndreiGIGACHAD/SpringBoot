spring.application.name=electronova
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/electronovadb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
info.app.name=ELECTRONOVA
info.app.description=Учебный каталог магазина электронной техники
logging.file.name=logs/electronova.log
